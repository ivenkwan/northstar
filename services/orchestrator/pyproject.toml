[project]
name = "northstar-orchestrator"
version = "0.1.0"
description = "Agent orchestrator: deterministic 12-step workflow (PRD §9.2), scope resolution (§11.1), typed components (§19.3)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
