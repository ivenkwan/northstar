[project]
name = "northstar-connectors"
version = "0.1.0"
description = "Source ingestion: canonical transforms, idempotent landing, reconciliation (PRD §14; ADR-031)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connectors"]
