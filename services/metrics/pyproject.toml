[project]
name = "northstar-metrics"
version = "0.1.0"
description = "Certified semantic metrics service (PRD §14.2, §8.3; ADR-030)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "fastapi>=0.115", "uvicorn>=0.32", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrics"]
