[project]
name = "northstar-knowledge-graph"
version = "0.1.0"
description = "Knowledge-graph service: typed query IR → Cypher (AGE), bounded subgraphs, provenance (PRD §18; ADR-029)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_graph"]
