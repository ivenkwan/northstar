[project]
name = "northstar-alerts"
version = "0.1.0"
description = "Alert dispatch: in-app/push/email/Teams channels, quiet hours, frequency caps, digests (PRD §8.6; ADR-034)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alerts"]
