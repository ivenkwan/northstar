# Local collector (docker-compose): receive OTLP, expose Prometheus metrics, debug logs.
# The production config (otel-collector.yaml) additionally ships traces to Tempo and
# writes the audit log stream — those backends do not exist in the local stack.
receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
