# Security controls (PRD §20 supply-chain row; §23.5 no-secret rule).
name: security

on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Vault-path pattern guard
        # AGENTS.md: no resolvable Vault path may enter Git. routes.yaml uses
        # $SECRET:// references with ${TENANT} placeholders — a concrete
        # tenant path (vault://byok/<tenant>/...) in a diff is a violation.
        run: |
          ! git grep -nE 'vault://byok/[a-z0-9_-]+/' -- . ':!*.md' ':!*runbooks*' \
            || { echo "ERROR: concrete Vault secret path found in tracked files"; exit 1; }

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "9.15.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level high || true   # report gate: triage in tracked issues
      - name: Python lock scan (osv)
        uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --frozen && uv run pip-audit --skip-editable || true
