[project]
name = "northstar-golden-tests"
version = "0.1.0"
description = "Release-gating golden suites (PRD §23.2-23.3, §28): GPM permission, GW gateway conformance, GA agent safety"
requires-python = ">=3.12"
dependencies = [
  "northstar-orchestrator",
  "northstar-metrics",
  "northstar-byok",
  "northstar-connectors",
  "northstar-knowledge-graph",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[tool.uv.sources]
northstar-orchestrator = { workspace = true }
northstar-metrics = { workspace = true }
northstar-byok = { workspace = true }
northstar-connectors = { workspace = true }
northstar-knowledge-graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golden"]
